spring.datasource.url=jdbc:h2:mem:smartshop;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true

app.jwt.secret=test-secret-for-automated-tests-only-0123456789
app.jwt.expiration-hours=1
app.cors.allowed-origins=http://localhost:8081
app.security.login.max-attempts=3
app.security.login.lock-minutes=15

app.backup.dir=target/test-backups
