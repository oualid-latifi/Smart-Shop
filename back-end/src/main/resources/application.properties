spring.application.name=smartshop

# Toute valeur sensible vient de variables d'environnement (voir ../.env.example).
# Aucun secret ne doit être écrit dans ce fichier.
# En développement, on peut les mettre dans back-end/.env (ignoré par git).
spring.config.import=optional:file:.env[.properties]

# --- Base de données PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartshop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate met à jour les tables à partir des entités (mettre "validate" en production)
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=true

server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.compression.enabled=true
server.shutdown=graceful

# --- Sécurité (JWT) ---
# Clé d'au moins 32 caractères, générée aléatoirement (ex : openssl rand -base64 48)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:168}

# Origines autorisées (séparées par des virgules). L'application mobile n'envoie pas d'en-tête Origin :
# cette liste ne concerne que les clients web.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

# Protection contre les attaques par force brute sur /api/auth/login
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# Adresse publique du serveur, utilisée dans le QR code des factures (ex : https://api.maboutique.ma)
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}

# --- Sauvegardes automatiques (chaque nuit, 14 fichiers conservés) ---
app.backup.dir=${BACKUP_DIR:backups}
app.backup.keep=${BACKUP_KEEP:14}
app.backup.cron=${BACKUP_CRON:0 30 2 * * *}
spring.servlet.multipart.max-file-size=${BACKUP_MAX_UPLOAD:100MB}
spring.servlet.multipart.max-request-size=${BACKUP_MAX_UPLOAD:100MB}

# --- Rapport hebdomadaire par email (facultatif) ---
# Serveur SMTP via les variables SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
app.mail.from=${MAIL_FROM:}
app.report.weekly-cron=${WEEKLY_REPORT_CRON:0 0 8 * * MON}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Supervision ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- Documentation de l'API (OpenAPI 3) ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}

# Derrière un hébergeur (Render, Nginx…) : adresse IP réelle des clients, seulement depuis un proxy du réseau interne
server.forward-headers-strategy=native
