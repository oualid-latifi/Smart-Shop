spring.application.name=smartshop

# --- Base de donnees PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartshop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate cree et met a jour les tables a partir des entites
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

server.port=8080

# --- Securite JWT ---
# Fournir une cle secrete d'au moins 32 octets via la variable d'environnement JWT_SECRET.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=15
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
