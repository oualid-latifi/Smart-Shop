name: Build SmartShop Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Adresse du back-end (ex. http://192.168.1.25:8080). Vide = à saisir dans l'application."
        required: false
        default: ""
  push:
    branches:
      - feature/new-design
    paths:
      - "smartshop-mobile/**"
      - ".github/workflows/build-smartshop-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartshop-mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: smartshop-mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: smartshop-mobile/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smartshop-android-apk
          path: smartshop-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
